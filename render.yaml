services:
  - type: web
    name: smartcredit-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: develop
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/
    autoDeployTrigger: commit
    # Les migrations et collectstatic sont exécutés automatiquement par
    # docker-entrypoint.sh avant le démarrage de Gunicorn.
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: smartcredit-db
          property: connectionString
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GUNICORN_WORKERS
        value: "1"
      - key: GUNICORN_THREADS
        value: "4"
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: smartcredit-db
    databaseName: smartcredit
    user: smartcredit
    plan: free
    region: frankfurt
